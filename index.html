<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مثال على التمرير السلس</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        nav { position: fixed; top: 0; left: 0; right: 0; background: #333; padding: 10px; }
        nav a { color: #fff; margin: 0 15px; text-decoration: none; }
        section { height: 100vh; padding-top: 60px; box-sizing: border-box; }
        #section1 { background: #f4f4f4; }
        #section2 { background: #e2e2e2; }
        #section3 { background: #d0d0d0; }
    </style>
</head>
<body>
    <nav>
        <a href="#section1">القسم 1</a>
        <a href="#section2">القسم 2</a>
        <a href="#section3">القسم 3</a>
    </nav>

    <section id="section1">
        <h1>القسم 1</h1>
        <p>محتوى القسم الأول.</p>
    </section>

    <section id="section2">
        <h1>القسم 2</h1>
        <p>محتوى القسم الثاني.</p>
    </section>

    <section id="section3">
        <h1>القسم 3</h1>
        <p>محتوى القسم الثالث.</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
