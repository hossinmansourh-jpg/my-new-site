<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جدارية مليون سيلفي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body, h1, p, a { margin:0; padding:0; }
    body { font-family: 'Open Sans', sans-serif; line-height: 1.6; background:#f4f4f4; }
    a { text-decoration:none; color:inherit; }
    .navbar {
      background:#222; color:#fff; display:flex; justify-content:space-between; align-items:center; padding:0.5rem 1rem;
    }
    .navbar a { color:#fff; margin-left:1rem; }
    .navbar a:hover { text-decoration:underline; }
    .hero {
      height:calc(100vh - 60px);
      background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)), url('https://source.unsplash.com/1600x900/?wall') center/cover no-repeat;
      color:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:0 1rem;
    }
    .hero h1 { font-family: 'Amiri', serif; font-size:3rem; margin-bottom:0.5rem; }
    .hero p { font-size:1.2rem; max-width:800px; margin-bottom:1.5rem; }
    .hero button {
      background:#ff5e3a; border:none; color:#fff; padding:0.75rem 1.5rem; font-size:1rem; cursor:pointer; border-radius:5px;
    }
    .hero button:hover { background:#e04a2a; }
    @media (max-width: 768px){
      .hero h1 { font-size:2.2rem; }
      .hero p { font-size:1rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo"><a href="#">جدارية مليون سيلفي</a></div>
    <div class="nav-links">
      <a href="#">الرئيسية</a>
      <a href="#">عن الجدارية</a>
      <a href="#">الصور</a>
      <a href="#">تواصل معنا</a>
    </div>
  </nav>

  <section class="hero">
    <h1>جدارية مليون سيلفي</h1>
    <p>استكشفوا جدارية تتضمن أكثر من مليون سيلفي، حيث تتلاقى الفن والذكريات في مساحة فريدة من نوعها. انضموا إلينا في رحلة اكتشاف الإبداع والذكريات المجتمعية.</p>
    <button>استكشف الجدارية</button>
  </section>
</body>
</html>
