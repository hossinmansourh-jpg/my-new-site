<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تكبير الشبكة</title>
<style>
  body{font-family: Arial, sans-serif; margin:0; padding:0; }
  /* Button */
  #zoomBtn{
    background:#28a745; color:#fff; padding:10px 20px;
    border:none; cursor:pointer; font-size:1.1em;
    position:fixed; top:10px; right:10px; z-index:1000;
  }
  /* Modal backdrop */
  #modalOverlay{
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:999;
  }
  /* Modal content */
  #modalContent{
    background:#fff; padding:20px; max-width:90%; max-height:90%; overflow:auto;
    border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.3);
  }
  /* Close button */
  #closeBtn{
    float:left; margin-bottom:10px; background:#dc3545; color:#fff; border:none; padding:5px 10px; cursor:pointer;
  }
  /* Example network placeholder */
  #network{
    width:1200px; height:800px; background:url('https://via.placeholder.com/1200x800') no-repeat center/contain;
  }
</style>
</head>
<body>
<button id="zoomBtn">تكبير الشبكة</button>

<div id="modalOverlay">
  <div id="modalContent">
    <button id="closeBtn">أغلق</button>
    <div id="network"></div>
  </div>
</div>

<script>
document.getElementById('zoomBtn').addEventListener('click', function(){
  document.getElementById('modalOverlay').style.display = 'flex';
});
document.getElementById('closeBtn').addEventListener('click', function(){
  document.getElementById('modalOverlay').style.display = 'none';
});
</script>
</body>
</html>
