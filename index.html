<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مرحباً بك في موقعي</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #f0f0f5;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            text-align: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 0.5em;
            color: #ff9f43;
        }
        p {
            margin-bottom: 1.5em;
            font-size: 1.1rem;
        }
        .social-links a {
            color: #ff9f43;
            text-decoration: none;
            margin: 0 0.7rem;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .social-links a:hover {
            color: #ffbf43;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في موقعي</h1>
        <p>
            مرحباً! أنا <strong>اسمك</strong>، مطور ويب شغوف بتحويل الأفكار إلى تطبيقات ويب جذابة وفعالة. أعمل على مشاريع صغيرة ومتوسطة، أُعشق تصميم الواجهات الحديثة وتطبيق أحدث تقنيات الويب.
        </p>
        <div class="social-links">
            <a href="https://facebook.com/yourprofile" target="_blank">فيسبوك</a>
            <a href="https://twitter.com/yourprofile" target="_blank">تويتر</a>
            <a href="https://instagram.com/yourprofile" target="_blank">انستغرام</a>
        </div>
    </div>
</body>
</html>
