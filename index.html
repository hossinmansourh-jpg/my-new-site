<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>شبكة قابل للتمرير وتكبير/تصغير مخصصة</title>
<style>
    :root {
        --square-size: 100px;          /* حجم المربع الأساسي */
        --gap-size: 4px;               /* المسافة بين المربعات */
    }

    body {
        font-family: 'Arial', sans-serif;
        background:#f0f4f7;
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:20px;
    }

    h1 {
        color:#2c3e50;
        margin-bottom:20px;
    }

    .controls {
        margin-bottom:15px;
    }
    .controls button {
        background:#3498db;
        color:white;
        border:none;
        border-radius:5px;
        padding:10px 15px;
        margin:0 5px;
        font-size:16px;
        cursor:pointer;
        transition:background 0.2s ease;
    }
    .controls button:hover {
        background:#2980b9;
    }
    .grid-container {
        width:800px;
        height:600px;
        background:#ecf0f1;
        border:1px solid #bdc3c7;
        overflow:auto;           /* قابل للتمرير */
        display:flex;
        align-items:flex-start;
    }
    .grid {
        display:flex;
        flex-wrap:wrap;
    }
    .grid-item {
        width:var(--square-size);
        height:var(--square-size);
        margin:var(--gap-size);
        background:#e74c3c;
        border:2px solid #c0392b;
        border-radius:3px;
        transition:width 0.2s, height 0.2s, background 0.2s;
    }
    /* ألوان مميزة عند التمرير */
    .grid-item:hover {
        background:#c0392b;
    }
</style>
</head>
<body>

<h1>شبكة قابل للتمرير مع تكبير/تصغير المربعات</h1>

<div class="controls">
    <button id="zoomInBtn">تكبير ⊕</button>
    <button id="zoomOutBtn">تصغير ⊖</button>
</div>

<div class="grid-container">
    <div class="grid" id="grid">
        <!-- المربعات ستُولد برمجياً -->
    </div>
</div>

<script>
    const grid = document.getElementById('grid');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const rootStyle = getComputedStyle(document.documentElement);

    // إنشاء شبكة 10x10 مربعات
    const rows = 10, cols = 10;
    for (let i = 0; i < rows * cols; i++) {
        const div = document.createElement('div');
        div.className = 'grid-item';
        grid.appendChild(div);
    }

    // دالة لتعديل حجم المربع
    function setSquareSize(delta) {
        let current = parseInt(rootStyle.getPropertyValue('--square-size'));
        let newSize = current + delta;
        if (newSize < 30) newSize = 30;      // الحد الأدنى
        if (newSize > 200) newSize = 200;    // الحد الأقصى
        document.documentElement.style.setProperty('--square-size', `${newSize}px`);
    }

    zoomInBtn.addEventListener('click', () => setSquareSize(20));
    zoomOutBtn.addEventListener('click', () => setSquareSize(-20));
</script>

</body>
</html>
