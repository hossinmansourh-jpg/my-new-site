```html
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>جدارية 1000×1000</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <div id="toolbar">
        <button id="zoomInBtn">+ تكبير</button>
        <button id="zoomOutBtn">- تصغير</button>
        <button id="panBtn">السحب</button>
        <button id="selectBtn">تحديد المربعات</button>
    </div>
    <canvas id="gridCanvas" width="2000" height="2000"></canvas>

    <!-- Modal لعرض معلومات صاحب الصورة -->
    <div id="infoModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeInfo" class="close">&times;</span>
            <h3>معلومات صاحب الصورة</h3>
            <p id="ownerInfo"></p>
        </div>
    </div>

    <!-- نموذج حجز -->
    <div id="bookingForm" class="modal hidden">
        <div class="modal-content">
            <span id="closeBooking" class="close">&times;</span>
            <h3>حجز مربعات مختارة</h3>
            <p>عدد المربعات المختارة: <span id="selectedCount"></span></p>
            <button id="confirmBooking">تأكيد الحجز</button>
        </div>
    </div>
</div>
</body>
</html>
