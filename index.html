<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>شبكة داخل مربع نصف حجم الشاشة</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* المربع الذي يحتوي على الشبكة */
  .network-container {
    width: 50vw;              /* نصف عرض الشاشة */
    height: 50vw;             /* جعل الارتفاع مساويًا للعرض لتشكيل مربع */
    max-width: 400px;         /* حد أعلى للحفاظ على الحجم في شاشات أكبر */
    max-height: 400px;
    background: #ffffff;
    box-shadow: 0 0 10px rgba(0,0,0,.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.2rem;
    color: #333;
  }
  /* مثال بسيط لشبكة داخل المربع */
  .network {
    width: 90%;
    height: 90%;
    background: #e0e0e0;
    border-radius: 4px;
    position: relative;
  }
  .network::before,
  .network::after {
    content: '';
    position: absolute;
    background: #4285F4;
    width: 2px;
    height: 100%;
    left: 50%;
    top: 0;
  }
  .network::after {
    width: 100%;
    height: 2px;
    left: 0;
    top: 50%;
  }
</style>
</head>
<body>
<div class="network-container">
  <div class="network" title="شبكة"></div>
</div>
</body>
</html>
