<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تواصل معنا</title>
    <style>
        body{font-family: Arial, sans-serif; padding:20px;}
        section{max-width:600px; margin:auto;}
        form{display:flex; flex-direction:column;}
        label{margin-top:10px; font-weight:bold;}
        input, textarea{padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px;}
        button{margin-top:15px; padding:10px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;}
        button:hover{background:#0056b3;}
    </style>
</head>
<body>
    <section>
        <h2>تواصل معنا</h2>
        <form action="#" method="post">
            <label for="name">الاسم</label>
            <input type="text" id="name" name="name" required>

            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" required>

            <label for="message">الرسالة</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">إرسال</button>
        </form>
    </section>
</body>
</html>
