<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black & Gold Theme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="day">
    <!-- Floating buttons -->
    <button id="themeToggle" class="float-btn float-left">🌙</button>
    <button id="langToggle" class="float-btn float-right">AR</button>

    <!-- Content -->
    <main id="content" class="container">
        <div id="english" class="lang-content">
            <h1>Welcome to Our Site</h1>
            <p>This is an example page styled in black and gold. Switch languages or themes using the buttons above.</p>
        </div>
        <div id="arabic" class="lang-content" dir="rtl" style="display:none;">
            <h1>أهلاً وسهلاً بكم في موقعنا</h1>
            <p>هذه صفحة مثال مُصمَّمة باللون الأسود والذهبي. استخدم الأزرار أعلاه لتبديل اللغات أو السمات.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
