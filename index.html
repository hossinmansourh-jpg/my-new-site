<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>Language Switcher Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 data-translate="title">Language Switcher Demo</h1>
        <button id="langToggle" aria-label="Switch language">العربية</button>
    </header>
    <main>
        <p data-translate="welcome">Welcome to the language switcher example.</p>
        <p data-translate="instruction">Click the button above to toggle between English and Arabic.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
