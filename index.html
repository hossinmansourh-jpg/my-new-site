<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدارية مليون صورة سيلفي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Overlay that hides while the page loads -->
    <div id="loadingOverlay" class="overlay">
        <span class="spinner"></span>
    </div>

    <!-- Main header -->
    <header class="site-header">
        <div class="logo">
            <!-- Replace with your logo image or text -->
            <h1>جدارية مليون صورة سيلفي</h1>
        </div>
        <div class="header-actions">
            <button id="langToggle" class="lang-toggle">عربي / EN</button>
            <div class="digital-badge">🖥️ التحدي الرقمي</div>
        </div>
    </header>

    <!-- Main content -->
    <main class="main-content">
        <!-- Canvas placeholder (or any other main grid element) -->
        <canvas id="mosaicCanvas" width="1200" height="800"></canvas>
        <!-- Example content to illustrate overflow handling -->
        <section class="gallery">
            <h2>الأعمال الفنية</h2>
            <p>عرض الصور يتألف من ملايين السيلفي.</p>
        </section>
    </main>

    <!-- Example modal (hidden by default) -->
    <div id="exampleModal" class="modal" aria-hidden="true">
        <div class="modal-content">
            <p>هذا نموذج من النافذة المنبثقة.</p>
            <button id="closeModal">إغلاق</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
