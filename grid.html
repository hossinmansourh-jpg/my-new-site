<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>مربع العداد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            direction: rtl; /* للكتابة من اليمين لليسار */
        }
        .counters {
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .counters span {
            margin-right: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-gap: 5px;
            justify-content: center;
        }
        .square {
            width: 30px;
            height: 30px;
            background-color: #eee;
            cursor: pointer;
            user-select: none;
        }
        .square.clicked {
            background-color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="counters">
        <span>المربعات المكلقة: <span id="clicked">0</span></span>
        <span>المربعات المتبقية: <span id="remaining">100</span></span>
    </div>

    <div class="grid" id="gridContainer">
        <!-- سيتم إنشاء المربعات عبر JavaScript -->
    </div>

    <script>
        (function() {
            const totalSquares = 100; // 10x10 grid
            let clickedCount = 0;

            const gridContainer = document.getElementById('gridContainer');
            const clickedSpan = document.getElementById('clicked');
            const remainingSpan = document.getElementById('remaining');

            // إنشاء المربعات
            for (let i = 0; i < totalSquares; i++) {
                const sq = document.createElement('div');
                sq.className = 'square';
                sq.dataset.clicked = 'false';
                gridContainer.appendChild(sq);
            }

            function updateCounters() {
                clickedSpan.textContent = clickedCount;
                remainingSpan.textContent = totalSquares - clickedCount;
            }

            // إضافة حدث النقر لكل مربع
            gridContainer.addEventListener('click', function(e) {
                const target = e.target;
                if (!target.classList.contains('square')) return;

                const isClicked = target.dataset.clicked === 'true';
                if (isClicked) {
                    target.classList.remove('clicked');
                    target.dataset.clicked = 'false';
                    clickedCount--;
                } else {
                    target.classList.add('clicked');
                    target.dataset.clicked = 'true';
                    clickedCount++;
                }
                updateCounters();
            });

            // التهيئة
            updateCounters();
        })();
    </script>
</body>
</html>
